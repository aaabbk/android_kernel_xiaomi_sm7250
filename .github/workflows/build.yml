name: Build Kernel

on:
  push:
    branches:
      - susfs-miui
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev \
            libncurses-dev ccache zip wget git

      - name: Create 10G swap
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 10G /mnt/swapfile || sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=10240 status=progress
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: /tmp/ccache
          key: ccache-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ github.ref_name }}-
            ccache-

      - name: Download AOSP Clang (r416183b)
        run: |
          # googlesource.com no longer hosts r416183b on master; use crDroid's mirror
          git clone --depth=1 -b 11.0 https://github.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r416183b toolchains/clang
          toolchains/clang/bin/clang --version | head -3

      - name: Download GCC 4.9 (aarch64 and arm)
        run: |
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 toolchains/gcc/aarch64
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 toolchains/gcc/arm
          toolchains/gcc/aarch64/bin/aarch64-linux-android-gcc --version | head -2

      - name: Generate defconfig
        run: |
          export PATH=$PWD/toolchains/clang/bin:$PATH
          export O=out
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=$PWD/toolchains/gcc/aarch64/bin/aarch64-linux-android-
          export CROSS_COMPILE_ARM32=$PWD/toolchains/gcc/arm/bin/arm-linux-androideabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CCACHE_DIR=/tmp/ccache
          make O=out CC="ccache clang" NM=llvm-nm OBJDUMP=llvm-objdump STRIP=llvm-strip picasso-stock_defconfig

      - name: Build kernel
        run: |
          export PATH=$PWD/toolchains/clang/bin:$PATH
          export O=out
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=$PWD/toolchains/gcc/aarch64/bin/aarch64-linux-android-
          export CROSS_COMPILE_ARM32=$PWD/toolchains/gcc/arm/bin/arm-linux-androideabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CCACHE_DIR=/tmp/ccache
          make -j$(nproc --all) O=out CC="ccache clang" NM=llvm-nm OBJDUMP=llvm-objdump STRIP=llvm-strip

      - name: Package kernel
        run: |
          mkdir -p release
          [ -f out/arch/arm64/boot/Image.gz ] && cp out/arch/arm64/boot/Image.gz release/ || true
          [ -f out/arch/arm64/boot/Image ] && cp out/arch/arm64/boot/Image release/ || true
          # Device tree blobs
          find out/arch/arm64/boot/dts -name "*.dtb" -exec cp {} release/ \; 2>/dev/null || true
          # Kernel modules
          find out -name "*.ko" -exec cp {} release/ \; 2>/dev/null || true
          ls -la release/
          cd release && zip -r ../kernel-picasso-stock.zip .
          ls -lh ../kernel-picasso-stock.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-picasso-stock
          path: kernel-picasso-stock.zip
          if-no-files-found: error
