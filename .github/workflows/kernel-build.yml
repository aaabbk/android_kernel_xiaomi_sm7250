name: Kernel build

on:
  push:
    branches:
      - ksu-miui-new
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kernel-build-${{ github.ref }}
  cancel-in-progress: true

env:
  ARCH: arm64
  DEFCONFIG: picasso-stock_defconfig
  CLANG_VERSION: r416183b
  TC_DIR: ${{ github.workspace }}/toolchains
  CCACHE_DIR: ${{ github.workspace }}/../ccache
  CCACHE_MAXSIZE: 1G

jobs:
  build:
    name: Build ${{ github.ref_name }}
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev make zip unzip rsync ccache

      - name: Cache toolchains
        id: cache-toolchains
        uses: actions/cache@v4
        with:
          path: ${{ env.TC_DIR }}
          key: toolchains-clang-${{ env.CLANG_VERSION }}-gcc4.9-v1

      - name: Fetch toolchains
        if: steps.cache-toolchains.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$TC_DIR"

          # AOSP clang r416183b, the version pinned by build.config.common
          curl -fsSL -o /tmp/clang.tar.gz \
            "https://codeload.github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b/tar.gz/refs/heads/lineage-20.0"
          mkdir -p "$TC_DIR/clang"
          tar -xzf /tmp/clang.tar.gz -C "$TC_DIR/clang" --strip-components=1
          rm -f /tmp/clang.tar.gz

          # Google GCC 4.9 for arm64 (binutils used for assembling/linking)
          curl -fsSL -o /tmp/gcc64.tar.gz \
            "https://codeload.github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9/tar.gz/refs/heads/lineage-19.1"
          mkdir -p "$TC_DIR/gcc64"
          tar -xzf /tmp/gcc64.tar.gz -C "$TC_DIR/gcc64" --strip-components=1
          rm -f /tmp/gcc64.tar.gz

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ github.ref_name }}-

      - name: Prepare ccache
        run: |
          set -euo pipefail
          mkdir -p "$CCACHE_DIR"
          ccache --max-size="$CCACHE_MAXSIZE"
          ccache --zero-stats

      - name: Show toolchain versions
        run: |
          set -euo pipefail
          "$TC_DIR/clang/bin/clang" --version
          "$TC_DIR/gcc64/bin/aarch64-linux-android-ld" --version | head -1
          ccache --version | head -1

      - name: Configure
        run: |
          set -euo pipefail
          export PATH="$TC_DIR/gcc64/bin:$TC_DIR/clang/bin:$PATH"
          make O=out ARCH="$ARCH" \
            CC="ccache clang" \
            LLVM_IAS=0 \
            CROSS_COMPILE="$TC_DIR/gcc64/bin/aarch64-linux-android-" \
            HOSTCC=gcc HOSTCXX=g++ \
            "$DEFCONFIG"

          # The stock defconfig alone is not buildable: device specific
          # options such as CONFIG_CPUSET_ASSIST live in the vendor
          # fragment, so merge it like the device build does.
          cat arch/arm64/configs/vendor/xiaomi/picasso.config >> out/.config
          make O=out ARCH="$ARCH" \
            CC="ccache clang" \
            LLVM_IAS=0 \
            CROSS_COMPILE="$TC_DIR/gcc64/bin/aarch64-linux-android-" \
            HOSTCC=gcc HOSTCXX=g++ \
            olddefconfig

      - name: Build kernel
        run: |
          set -euo pipefail
          export PATH="$TC_DIR/gcc64/bin:$TC_DIR/clang/bin:$PATH"
          make -j"$(nproc)" O=out ARCH="$ARCH" \
            CC="ccache clang" \
            LLVM_IAS=0 \
            CROSS_COMPILE="$TC_DIR/gcc64/bin/aarch64-linux-android-" \
            HOSTCC=gcc HOSTCXX=g++ \
            KBUILD_BUILD_USER=github-actions \
            KBUILD_BUILD_HOST=github-actions \
            Image dtbs dtbo.img

      - name: Package AnyKernel3 zip
        run: |
          set -euo pipefail
          AK3=ak3-build
          rm -rf "$AK3"
          cp -a ak3 "$AK3"

          cp out/arch/arm64/boot/Image "$AK3/Image"
          # The boot image carries the platform dtbs appended to the kernel;
          # ship the same set separately so AnyKernel3 repacks Image + dtb.
          find out/arch/arm64/boot/dts -name '*.dtb' -print0 | xargs -0 cat > "$AK3/dtb"
          cp out/arch/arm64/boot/dtbo.img "$AK3/dtbo.img"

          test -s "$AK3/Image"
          test -s "$AK3/dtb"
          test -s "$AK3/dtbo.img"
          python3 -c "import sys; sys.exit(0 if open('ak3-build/dtb','rb').read(4) == b'\xd0\x0d\xfe\xed' else 1)"

          ( cd "$AK3" && zip -r9 "../picasso-ak3-${GITHUB_SHA::7}.zip" . )

      - name: ccache stats
        if: always()
        run: ccache --show-stats || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ github.sha }}
          path: |
            picasso-ak3-*.zip
            out/arch/arm64/boot/Image
            ak3-build/dtb
            out/arch/arm64/boot/dtbo.img
            out/System.map
            out/.config
          if-no-files-found: error
